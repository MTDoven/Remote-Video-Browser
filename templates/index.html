<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111513">
  <title>Video Library</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script defer src="/static/vendor/hls-1.7.3.min.js"></script>
  <script defer src="/static/app.js"></script>
</head>
<body>
  <header class="header">
    <a class="brand" href="#"><span class="brand-icon" aria-hidden="true">▶</span>Library <small>VIDEO LIBRARY</small></a>
    <label class="search"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="Search item names…" aria-label="Search item names" autocomplete="off"></label>
    <button id="refresh" class="button" type="button">↻ <span>Refresh library</span></button>
  </header>
  <main class="layout">
    <section class="library" aria-label="Library">
      <nav class="tabs"><a href="#mode=recommendations" id="items-tab">Recommendations</a><a href="#mode=directory" id="folders-tab">Browse folders</a><button id="refresh-recommendations" class="recommendations-refresh" type="button" hidden>Refresh recommendations</button></nav>
      <nav id="breadcrumbs" class="breadcrumbs" aria-label="Current location"></nav>
      <div class="section-head"><div><p class="eyebrow" id="eyebrow">BROWSE DIRECTORY</p><h1 id="title">Library</h1></div><span id="count" class="muted"></span></div>
      <div id="library-message" class="message" role="status" hidden></div>
      <div id="grid" class="grid" aria-live="polite"></div>
      <button id="load-status" class="load-status" type="button">Loading…</button>
    </section>
    <aside class="player-panel" aria-label="Player">
      <div class="player-heading"><span class="eyebrow">NOW PLAYING</span><button id="close-player" class="icon-button" title="Stop playback" aria-label="Stop playback" hidden>×</button></div>
      <div class="screen"><video id="player" controls playsinline preload="metadata" hidden></video><div id="player-empty"><span class="play-symbol">▶</span><h2>Choose a video to start watching</h2><p>Original quality · Seek anytime</p></div></div>
      <h2 id="player-title">No video selected</h2>
      <p id="player-meta" class="muted">Open an item to browse its videos.</p>
      <div id="player-status" class="message" role="status" hidden></div>
      <div class="player-actions"><button id="play-button" class="button primary" hidden>Play</button><button id="fullscreen" class="button" hidden>Fullscreen</button></div>
    </aside>
  </main>
  <footer><span id="library-status">Loading the index…</span><span id="cache-status"></span></footer>
  <dialog id="preview"><div class="dialog-head"><div><span class="eyebrow">CONTACT SHEET</span><h2 id="preview-title">Detailed preview</h2></div><button id="close-preview" class="icon-button" aria-label="Close preview">×</button></div><p id="preview-status" class="muted" role="status"></p><img id="preview-image" alt="Video contact sheet" hidden></dialog>
</body>
</html>
